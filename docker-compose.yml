services:
  mongodb:
    image: mongo:7
    container_name: nammongodb
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db

  product-api:
    build: .
    container_name: product-api
    restart: unless-stopped
    ports:
      - "${API_PORT:-3001}:3000"
    environment:
      PORT: 3000
      MONGO_URI: mongodb://mongodb:27017/productdb
    depends_on:
      - mongodb

volumes:
  mongo_data: