name: CD Docker Hub

on:
  workflow_run:
    workflows: ["Test Product CI Prod"]
    types: [completed]
    branches: [main]
  workflow_dispatch:

jobs:
  push-image:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - name: Get short SHA
        id: vars
        run: echo "short_sha=$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/product-api:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/product-api:${{ steps.vars.outputs.short_sha }}

      - name: Verify image can be pulled
        run: |
          docker pull ${{ secrets.DOCKERHUB_USERNAME }}/product-api:latest
          docker image ls ${{ secrets.DOCKERHUB_USERNAME }}/product-api

  deploy-local:
    needs: push-image
    runs-on: [self-hosted, windows]
    timeout-minutes: 10
    steps:
      - name: Pull image moi va khoi dong lai container
        shell: powershell
        working-directory: D:\product-api
        run: |
          $ErrorActionPreference = 'Continue'
          docker compose -f docker-compose-prod.yaml pull
          if ($LASTEXITCODE -ne 0) { exit 1 }
          docker compose -f docker-compose-prod.yaml up -d --wait --wait-timeout 180
          if ($LASTEXITCODE -ne 0) { docker compose -f docker-compose-prod.yaml logs; exit 1 }
          docker ps --format "table {{.Names}}\t{{.Image}}\t{{.Status}}"