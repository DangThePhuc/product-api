name: Test Product CI Prod

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  simple:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm test
      - run: docker build -t product-api:ci .

  ci-prod:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm test
      - name: Start MongoDB and API with Docker Compose
        run: docker compose up -d --build --wait --wait-timeout 120
      - name: Verify healthchecks
        run: |
          for c in nammongodb product-api; do
            status=$(docker inspect --format '{{.State.Health.Status}}' "$c")
            echo "$c: $status"
            [ "$status" = "healthy" ]
          done
      - name: Run CRUD integration test
        env:
          BASE_URL: http://localhost:3001
        run: bash scripts/crud-test.sh
      - name: Show logs on failure
        if: failure()
        run: docker compose logs
      - name: Tear down
        if: always()
        run: docker compose down -v